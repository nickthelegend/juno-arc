# Juno launchpad on Arc — indexed entities.
#
# Units. Fields typed BigDecimal are display units: base amounts are tokens
# (18 decimals), quote amounts are USDC (the only quote on Arc; the 6-decimal
# ERC-20 at 0x3600…0000), so a quote amount is also a USD amount. Fields ending
# in `Raw` and every `sqrtPriceX96` are the contract's own integers. Envio's GraphQL serialises BigInt and BigDecimal as strings;
# Int stays a number.
#
# Addresses are EIP-55 checksummed, so filter with checksummed values.
#
# Rows are per chain (`disable_default_cross_chain: true` in config.yaml): every
# entity also carries a generated `chainId`.

"""
One launchpad deployment: global counters and the settings new launches inherit.
"""
type Launchpad {
  "The launchpad's address."
  id: ID!
  "Where completed curves graduate to. Null until one is set."
  graduator: String
  "Protocol share of trading fees, in basis points, for launches from now on."
  protocolShareBps: Int!
  poolCount: Int!
  tradeCount: Int!
  completedCount: Int!
  graduatedCount: Int!
}

"""
A quote token a pool can be priced in. On Arc that is only USDC, so this table
has one row: the protocol-wide volume and fee totals.
"""
type QuoteToken {
  "The quote token's address (USDC, 0x3600…0000)."
  id: ID!
  decimals: Int!
  "Whether new launches may use it."
  allowed: Boolean!
  poolCount: Int!
  tradeCount: Int!
  "Sum of every trade's quoteAmount, in this quote."
  volume: BigDecimal!
  "Trading fees charged, in this quote."
  fees: BigDecimal!
  "The protocol's share of `fees`."
  protocolFeesAccrued: BigDecimal!
  protocolFeesClaimed: BigDecimal!
  pools: [Pool!]! @derivedFrom(field: "quoteToken")
}

"""
One post's market: its token, its bonding curve, and everything that happened on it.
"""
type Pool {
  "The token's address."
  id: ID!
  launchpad: String!
  creator: String! @index
  "Quote token address: USDC (0x3600…0000)."
  quote: String! @index
  quoteToken: QuoteToken!
  quoteDecimals: Int!
  "Which preset shaped the curve (informational)."
  preset: Int!
  name: String!
  symbol: String!
  "Pinned metadata, usually ipfs://…"
  uri: String!
  """
  The coin's TOKEN/USDC Uniswap v2 pair: before graduation the address the token
  refuses transfers to, after graduation where it trades. Zero when no
  graduator was set at launch.
  """
  venue: String!
  """
  The address the token refused transfers to until graduation: the Uniswap v2
  pair. It holds the venue's liquidity afterwards, so it is never counted as a
  holder.
  """
  lock: String!
  "Protocol share of this pool's fees, fixed at launch."
  protocolShareBps: Int!

  sqrtStartPriceX96: BigInt!
  "The curve's top: the price at which it completes."
  sqrtEndPriceX96: BigInt!
  "Supply the curve sells."
  curveBase: BigDecimal!
  "Supply reserved for the AMM at graduation."
  migrationBase: BigDecimal!
  "Quote the curve holds when full."
  migrationQuoteThreshold: BigDecimal!

  launchedAt: BigInt! @index
  launchBlock: BigInt!
  launchTx: String!

  "Current curve price, as a Q64.96 square root of USDC units (6-dec) per base wei."
  sqrtPriceX96: BigInt!
  "Current marginal curve price, USDC per token. Market cap is this × 1,000,000,000."
  spotPrice: BigDecimal! @index
  "Realised price of the most recent trade."
  lastPrice: BigDecimal
  "Curve supply not yet sold."
  baseReserve: BigDecimal!
  "Quote the curve holds, fees excluded. Progress is quoteReserve / migrationQuoteThreshold."
  quoteReserve: BigDecimal!

  tradeCount: Int!
  buyCount: Int!
  sellCount: Int!
  "Sum of trade quoteAmount (buys fee-inclusive, sells net of fee)."
  volumeQuote: BigDecimal! @index
  feesQuote: BigDecimal!
  "The creator's share of fees, earned to date."
  creatorFeesEarned: BigDecimal!
  creatorFeesClaimed: BigDecimal!
  "Addresses holding a non-zero balance, excluding the launchpad and the venue's `lock`."
  holderCount: Int! @index
  lastTradeAt: BigInt

  complete: Boolean!
  completedAt: BigInt
  graduated: Boolean!
  graduatedAt: BigInt
  graduationTx: String
  "LP tokens minted into the pair at graduation (raw)."
  liquidity: BigInt
  "Tokens burned at graduation: unsold curve dust plus the rounding buffer."
  burned: BigDecimal

  trades: [Trade!]! @derivedFrom(field: "pool")
  "Trades against the coin's Uniswap v2 pair, after it graduated there."
  pairTrades: [PairTrade!]! @derivedFrom(field: "pool")
  positions: [Position!]! @derivedFrom(field: "pool")
  creatorClaims: [CreatorClaim!]! @derivedFrom(field: "pool")
  "Creator fee claims sent cross-chain through Circle CCTP."
  creatorFeeBridges: [CreatorFeesBridge!]! @derivedFrom(field: "pool")
}

"""
One buy or sell on a curve, from the launchpad's `Trade` event.
"""
type Trade
  @index(fields: ["token", "blockNumber", "logIndex"])
  @index(fields: ["trader", "blockNumber", "logIndex"]) {
  "`${txHash}:${logIndex}`"
  id: ID!
  txHash: String!
  "Position of the log within its block."
  logIndex: Int!
  blockNumber: BigInt!
  "Block time, unix seconds."
  timestamp: BigInt!

  token: String! @index
  "Whose position changed: the recipient of a buy, the seller of a sell."
  trader: String! @index
  pool: Pool!
  account: Account!
  quote: String!

  isBuy: Boolean!
  "Tokens that changed hands."
  baseAmount: BigDecimal!
  "Quote paid (buy, fee included) or received (sell, fee deducted)."
  quoteAmount: BigDecimal!
  fee: BigDecimal!
  "The curve's price right after this trade (from sqrtPriceX96) — what a chart plots."
  price: BigDecimal!
  "Execution price: quoteAmount / baseAmount, fee included."
  executionPrice: BigDecimal!
  baseAmountRaw: BigInt!
  quoteAmountRaw: BigInt!
  feeRaw: BigInt!

  "Curve price after the trade."
  sqrtPriceX96: BigInt!
  "Quote the curve holds after the trade, fees excluded."
  quoteReserve: BigDecimal!
}

"""
An address that has traded, held or launched on Juno.
"""
type Account {
  "The address."
  id: ID!
  tradeCount: Int! @index
  buyCount: Int!
  sellCount: Int!
  "Pools this address has traded at least once."
  poolsTraded: Int!
  launchCount: Int!
  firstSeenAt: BigInt!
  firstSeenBlock: BigInt!
  lastTradeAt: BigInt
  trades: [Trade!]! @derivedFrom(field: "account")
  positions: [Position!]! @derivedFrom(field: "account")
}

"""
One address in one pool: its real balance, and what its trades paid and returned.
Cost basis is average cost, matching the app: a sell releases cost pro rata, and
tokens sold beyond what trades bought have no cost to match and are left out.
"""
type Position @index(fields: ["trader", "balance"]) {
  "`${trader}-${token}`"
  id: ID!
  trader: String! @index
  token: String! @index
  account: Account!
  pool: Pool!

  "ERC-20 balance, from every Transfer (trades, transfers, graduation)."
  balance: BigDecimal! @index
  "Bought minus sold through the curve. Differs from balance when tokens moved by transfer."
  netBase: BigDecimal!
  boughtBase: BigDecimal!
  soldBase: BigDecimal!
  "Quote paid on buys, fees included."
  spentQuote: BigDecimal!
  "Quote received on sells, net of fees."
  receivedQuote: BigDecimal!
  feesPaid: BigDecimal!

  "Tokens the cost basis still covers."
  basisBase: BigDecimal!
  "Quote paid for those tokens. Average cost is costBasis / basisBase."
  costBasis: BigDecimal!
  "Profit taken on sells, against average cost, in quote."
  realizedPnl: BigDecimal! @index

  tradeCount: Int!
  buyCount: Int!
  sellCount: Int!
  firstTradeAt: BigInt
  lastTradeAt: BigInt
  updatedAt: BigInt!
}

"""
A completed curve's reserves moving into its AMM pair.
"""
type Graduation {
  "The token's address."
  id: ID!
  pool: Pool!
  token: String!
  venue: String!
  "Tokens sent to the pair."
  baseAmount: BigDecimal!
  "Quote sent to the pair."
  quoteAmount: BigDecimal!
  "LP tokens minted (raw)."
  liquidity: BigInt!
  burned: BigDecimal!
  txHash: String!
  blockNumber: BigInt!
  timestamp: BigInt!
}

"""
A creator withdrawing the fees their post's market earned. A cross-chain claim
also emits one, with `to` = Circle's TokenMessengerV2; its CreatorFeesBridge row
says where the USDC went.
"""
type CreatorClaim {
  "`${txHash}:${logIndex}`"
  id: ID!
  pool: Pool!
  token: String! @index
  creator: String! @index
  to: String!
  amount: BigDecimal!
  amountRaw: BigInt!
  txHash: String!
  blockNumber: BigInt!
  timestamp: BigInt!
}

"""
A coin's TOKEN/USDC Uniswap v2 pair, its graduation venue. Registered at launch —
its address is fixed then — and silent until graduation mints its liquidity.
"""
type V2Pair {
  "The pair's address."
  id: ID!
  token: String! @index
  pool: Pool!
  "Whether the coin is the pair's token0 (the lower address)."
  coinIsToken0: Boolean!
  quoteDecimals: Int!
  "Reserves after the pair's last Sync."
  coinReserveRaw: BigInt!
  quoteReserveRaw: BigInt!
  tradeCount: Int!
  "Sum of trade quoteAmount."
  volumeQuote: BigDecimal!
  "The pair's price after its last trade, quote per token."
  lastPrice: BigDecimal
  lastTradeAt: BigInt
}

"""
One trade against a graduated coin's v2 pair — through Juno's router or any
other. The trader is the transaction's sender.
"""
type PairTrade @index(fields: ["token", "blockNumber", "logIndex"]) @index(fields: ["trader", "blockNumber", "logIndex"]) {
  "`${txHash}:${logIndex}`"
  id: ID!
  txHash: String!
  logIndex: Int!
  blockNumber: BigInt!
  timestamp: BigInt!

  pair: V2Pair!
  token: String! @index
  pool: Pool!
  trader: String! @index
  isBuy: Boolean!
  "Tokens that changed hands."
  baseAmount: BigDecimal!
  "Quote paid on a buy (v2's 0.3% fee included) or received on a sell."
  quoteAmount: BigDecimal!
  "The pair's price right after the trade, quote per token — what a chart plots."
  price: BigDecimal!
}

"""
Creator fees sent to another chain through Circle CCTP V2
(`claimCreatorFeesCrossChain`, event `CreatorFeesBridged`). The USDC is burned
on Arc and minted to `mintRecipient` on the destination domain once Circle
attests the message.
"""
type CreatorFeesBridge {
  "`${txHash}:${logIndex}`"
  id: ID!
  pool: Pool!
  token: String! @index
  creator: String! @index
  "CCTP destination domain (Ethereum 0, Avalanche 1, OP 2, Arbitrum 3, Solana 5, Base 6, …)."
  destinationDomain: Int!
  "The recipient on the destination chain, as CCTP's bytes32."
  mintRecipient: String!
  "USDC burned on Arc."
  amount: BigDecimal!
  amountRaw: BigInt!
  "Most the creator agreed to pay Circle for a fast transfer; 0 for standard."
  maxFee: BigDecimal!
  maxFeeRaw: BigInt!
  txHash: String!
  blockNumber: BigInt!
  timestamp: BigInt!
}
