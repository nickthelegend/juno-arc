name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything here runs without secrets and without touching a live network.
# The integration suite (tests/integration) reads Monad testnet, Pyth and
# Tessera, so it is run by hand — `npm run test:integration` — not here.
jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Submodules (forge-std, OpenZeppelin, Uniswap v2)
        run: git submodule update --init --recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        working-directory: contracts
        run: forge build

      - name: Test
        working-directory: contracts
        run: forge test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static analysis (Slither)
        # Fails on any medium or high finding. The ones reviewed and judged
        # safe carry a `slither-disable-next-line` with the reason beside them.
        working-directory: contracts
        run: |
          pip install slither-analyzer==0.11.6
          slither . --filter-paths "lib/|test/|script/|src/vendor/" --exclude-dependencies --fail-medium

  app:
    name: App (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. Nothing here connects to anything; real
      # values are injected by the host at deploy.
      NEXT_PUBLIC_MONAD_NETWORK: testnet
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      MONGODB_URI: mongodb://localhost:27017/ci
      JUNO_KEY_SECRET: Y2ktb25seS1ub3QtYS1yZWFsLXNlY3JldC0zMmJ5dGVz
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Route types
        # `tsc` reads the route types Next generates; this writes them without
        # a full build.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        # Biome over the API, the app, the scripts, the plugin and the CRE workflow (biome.json).
        run: npm run lint

      - name: Unit tests
        # Pure logic: no network, no database, no keys.
        run: npx vitest run tests/unit

      - name: Contract fixtures match the app's curve builder
        # contracts/test/PresetParity.t.sol launches every preset from these
        # fixtures and checks the chain agrees to the wei. Regenerating them
        # from lib/juno/curves.ts must change nothing, or the two have drifted.
        run: |
          npx tsx scripts/curve-fixtures.ts
          git diff --exit-code -- contracts/test/fixtures

      - name: Production build
        run: npx next build --webpack

  indexer:
    name: Indexer (Envio handlers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Codegen
        # Writes .envio/types.d.ts from config.yaml and schema.graphql; the
        # handlers and tests are typed against it.
        run: pnpm codegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Handler tests
        # Simulated events through Envio's test indexer, in memory: no
        # Postgres, no RPC, no Docker.
        run: pnpm test

  expo:
    name: Expo app (types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juno-expo/package-lock.json

      - name: Install
        working-directory: juno-expo
        run: npm ci

      - name: Typecheck
        working-directory: juno-expo
        run: npx tsc --noEmit

  plugin:
    name: MetaMask plugin and Kimi agent (types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mm-plugin-juno/package-lock.json

      - name: Install
        working-directory: mm-plugin-juno
        run: npm ci

      - name: Typecheck
        working-directory: mm-plugin-juno
        run: npm run type-check

      # Kimi's side of the agent loop is a scripted test double here; the
      # live model needs MOONSHOT_API_KEY and is never called from CI.
      - name: Tests
        working-directory: mm-plugin-juno
        run: npm test

  cre:
    name: Chainlink CRE workflow (types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        working-directory: cre/juno-nav
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cre/juno-nav
        run: bun run typecheck

      # On the CRE SDK's test runtime: EVM and HTTP capabilities are mocks.
      - name: Tests
        working-directory: cre/juno-nav
        run: bun test
